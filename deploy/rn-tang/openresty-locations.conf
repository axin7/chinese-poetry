# Include only in the existing rn-proxy-test.anyveo.com HTTPS server block.
# The required auth include is generated on RN and must never enter source control.
location = /poetry/search {
    include /www/sites/rn-proxy-test.anyveo.com/poetry-auth.conf;
    if ($request_method != POST) { return 405; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18080/search;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
}

location ^~ /poetry/poems/ {
    include /www/sites/rn-proxy-test.anyveo.com/poetry-auth.conf;
    if ($request_method != GET) { return 405; }
    proxy_pass http://127.0.0.1:18080/poems/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
}
