server {
    listen 80;
    server_name rn-proxy-test.anyveo.com;

    access_log /www/sites/rn-proxy-test.anyveo.com/access.log combined;
    error_log /www/sites/rn-proxy-test.anyveo.com/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/rn-proxy-test.anyveo.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /rn-proxy-check {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Origin-ID "rn-poetry-network-20260922" always;
        content_by_lua_block {
            local cjson = require "cjson"
            local args = ngx.req.get_uri_args(20)
            local nonce = args.nonce or ""
            if type(nonce) == "table" then nonce = nonce[1] end
            if type(nonce) ~= "string" then nonce = "" end
            ngx.say(cjson.encode({
                origin = "rn-poetry-network-20260922",
                nonce = string.sub(nonce, 1, 256),
                timestamp = ngx.now()
            }))
        }
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name rn-proxy-test.anyveo.com;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/rn-proxy-test.anyveo.com/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/rn-proxy-test.anyveo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RNProxyTestSSL:1m;
    ssl_session_timeout 10m;

    access_log /www/sites/rn-proxy-test.anyveo.com/access.log combined;
    error_log /www/sites/rn-proxy-test.anyveo.com/error.log warn;

    location = /rn-proxy-check {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Origin-ID "rn-poetry-network-20260922" always;
        content_by_lua_block {
            local cjson = require "cjson"
            local args = ngx.req.get_uri_args(20)
            local nonce = args.nonce or ""
            if type(nonce) == "table" then nonce = nonce[1] end
            if type(nonce) ~= "string" then nonce = "" end
            ngx.say(cjson.encode({
                origin = "rn-poetry-network-20260922",
                nonce = string.sub(nonce, 1, 256),
                timestamp = ngx.now()
            }))
        }
    }

    location / {
        return 404;
    }
}
